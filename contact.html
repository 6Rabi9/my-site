<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты — Кофейня "Аромат"</title>
    <link rel="stylesheet" href="css/contact.css">
</head>
<body>
    <header>
        <h1>☕ Кофейня "Аромат"</h1>
        <nav>
            <a href="index.html">Главная</a>
            <a href="menu.html">Меню</a>
            <a href="contact.html" class="active">Контакты</a>
        </nav>
    </header>

    <main>
        <h2 class="page-title">Свяжитесь с нами</h2>

        <div class="contact-wrapper">
            <section class="contact-info">
                <h3>Наш адрес</h3>
                <p>📍 г. Москва, ул. Кофейная, 15</p>
                <p>📞 +7 (999) 123-45-67</p>
                <p>✉️ info@aromat-coffee.ru</p>

                <h3>Часы работы</h3>
                <p>Пн–Пт: 8:00 – 22:00</p>
                <p>Сб–Вс: 9:00 – 23:00</p>
            </section>

            <section class="contact-form">
                <h3>Напишите нам</h3>
                <form>
                    <label for="name">Ваше имя</label>
                    <input type="text" id="name" placeholder="Иван" required>

                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="ivan@example.com" required>

                    <label for="message">Сообщение</label>
                    <textarea id="message" rows="5" placeholder="Ваше сообщение..." required></textarea>

                    <button type="submit">Отправить</button>
                </form>
            </section>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Кофейня "Аромат". Все права защищены.</p>
    </footer>
</body>
</html>
